# App + Postgres em um comando só.
#
# Coolify: build pack "Docker Compose". As variáveis SERVICE_* são geradas pela
# própria plataforma na primeira implantação — você não precisa inventar nem
# colar segredo nenhum. Depois de subir, defina o domínio em Domains (serviço
# `app`, porta 3000).
#
# Docker puro (VPS, máquina local): rode `./scripts/setup-env.sh` uma vez para
# gerar um .env com esses mesmos nomes e depois `docker compose up -d`.
#
# `environment` usa a forma de mapa (`CHAVE: valor`), e não a de lista, de
# propósito: o Coolify reescreve esse bloco antes de chamar o compose, e uma
# entrada de lista sem `=` vira uma chave numérica, que o compose rejeita com
# "non-string key in services.app.environment: 0".

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: multitela
      POSTGRES_DB: multitela
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_POSTGRES}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # O app só sobe depois que o banco aceita conexões: sem isso a primeira
      # implantação falharia nas migrações por corrida de inicialização.
      test: ['CMD-SHELL', 'pg_isready -U multitela -d multitela']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  app:
    build:
      context: .
      args:
        # NEXT_PUBLIC_* são embutidas no bundle, então precisam existir no build.
        NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-Multitela}
        NEXT_PUBLIC_TRIAL_DAYS: ${NEXT_PUBLIC_TRIAL_DAYS:-7}
        NEXT_PUBLIC_PRICE_MONTHLY: ${NEXT_PUBLIC_PRICE_MONTHLY:-19.90}
        NEXT_PUBLIC_PRICE_YEARLY: ${NEXT_PUBLIC_PRICE_YEARLY:-199}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://multitela:${SERVICE_PASSWORD_POSTGRES}@postgres:5432/multitela
      # Criptografa favoritos e histórico no banco. Fica fora do banco de
      # propósito: junto com os dados, não protegeria nada.
      APP_ENCRYPTION_KEY: ${SERVICE_BASE64_64_ENCRYPTION}
      # Opcionais - o app funciona sem elas.
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      APP_URL: ${APP_URL:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PRICE_MONTHLY: ${STRIPE_PRICE_MONTHLY:-}
      STRIPE_PRICE_YEARLY: ${STRIPE_PRICE_YEARLY:-}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - '${APP_PORT:-3000}:3000'

volumes:
  postgres-data:
