# Publica a porta do app no host, para rodar fora do Coolify:
#
#   docker compose up -d          -> http://localhost:3000
#   APP_PORT=8080 docker compose up -d
#
# O Docker Compose carrega este arquivo sozinho quando você não passa `-f`.
# O Coolify sempre passa `-f docker-compose.yml`, então lá ele é ignorado — e
# é por isso que a porta não entra em conflito com outros apps do servidor.

services:
  app:
    ports:
      - '${APP_PORT:-3000}:3000'
