appId: com.iptvplayer.desktop
productName: IPTV Player
copyright: Copyright © IPTV Player

directories:
  output: dist
  buildResources: build

# Only the Electron shell goes into app.asar. The actual app (Next.js standalone
# server + its own traced node_modules) is shipped via extraResources below and
# run as a child process - see electron/main.js. Without the node_modules
# exclusion, electron-builder's own dependency walk pulls in every optional
# per-platform native binary next/sharp ship (Windows/Mac/Linux swc, libvips...),
# adding several hundred MB that electron/main.js never touches.
files:
  - electron/**/*
  - package.json
  - "!node_modules/**/*"

extraResources:
  # electron-builder unconditionally drops any "node_modules" dir that sits at
  # the root of a copy `from`, so the standalone server's own node_modules
  # needs its own entry (rooted *inside* node_modules) to survive the copy.
  - from: .next/standalone
    to: app
    filter:
      - '**/*'
      - '!node_modules'
  - from: .next/standalone/node_modules
    to: app/node_modules
    filter:
      - '**/*'

win:
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
  icon: build/icon.ico
  artifactName: '${productName}-${version}-${arch}.${ext}'

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true

portable:
  artifactName: '${productName}-${version}-portable.${ext}'
